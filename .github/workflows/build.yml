name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libxtst6 libxkbfile1 libasound2t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 xvfb xauth
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: GUI smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke.py
      - name: GUI smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke.py
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pluma-${{ runner.os }}-x64
          path: dist/Pluma/
          retention-days: 14
