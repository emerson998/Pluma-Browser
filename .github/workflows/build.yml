name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libnss3 libxtst6 libxkbfile1 libasound2t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 xvfb xauth
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: GUI smoke (Linux)
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke.py && xvfb-run -a python scripts/features_smoke.py
      - name: GUI smoke (Windows)
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: python scripts/smoke.py
      - name: Feature smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/features_smoke.py
      - run: python scripts/build.py
      - name: Packaged executable smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/packaged_smoke.py
      - name: Packaged executable smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/packaged_smoke.py
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: Pluma-${{ runner.os }}-x64
          path: release/
          retention-days: 14

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Merge checksums and packages
        run: |
          mkdir -p publish
          find release -type f ! -name SHA256SUMS.txt -exec cp {} publish/ \;
          cd publish
          sha256sum * > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: publish/*
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(find publish -name 'Pluma-*-Linux-x64.deb' -printf '%f' | sed 's/Pluma-//;s/-Linux-x64.deb//')
          TAG="v$VERSION"
          HEAD=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists; this build will not publish."
            exit 0
          fi
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; increase the package version to publish another."
          else
            gh release create "$TAG" publish/* --repo "$REPOSITORY" --target "$GITHUB_SHA" --title "Pluma $TAG" --generate-notes
          fi
