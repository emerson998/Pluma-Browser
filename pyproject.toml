[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "pluma-browser"
version = "0.3.0"
description = "Minimal Chromium desktop browser with native blocking and optional AI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Emerson Oliveira"}]
dependencies = ["PySide6==6.12.0", "httpx[socks]>=0.28,<0.29", "keyring>=25,<26", "adblock==0.6.0", "packaging>=24,<27", "psutil>=7,<8"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.16,<7", "psutil>=7,<8"]
[project.gui-scripts]
pluma = "pluma.app:main"
[tool.setuptools.packages.find]
include = ["pluma*"]
[tool.setuptools.package-data]
pluma = ["data/fonts/*", "data/icons/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
